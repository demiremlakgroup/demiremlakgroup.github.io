<style>
body {

.container {

/* ALTIN YAZI */

/* SLOGAN */

.card {
  background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
  border-radius: 15px;
  padding: 15px;
  margin: 10px 0;
  display: flex;
  align-items: center;
  gap: 15px;
  border: 1px solid rgba(212,175,55,0.3);
  transition: 0.3s;
  position: relative;
}

.card:hover {
  transform: scale(1.03);
  border-color: gold;
}

/* ICON */
.icon {
  font-size: 20px;
  color: gold;
}

/* LINK */
.card a {
  color: white;
  text-decoration: none;
  font-size: 15px;
}

/* Kartın tamamı tıklanabilir */
.card a::after {
  content: "";
  position: absolute;
  inset: 0;
}

/* FOOTER */
.footer {
  text-align: center;
  font-size: 12px;
  margin-top: 15px;
  color: #777;

.fa-instagram {
