<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #000;
  color: white;
} 

.container {
  max-width: 420px;
  margin: auto;
  padding: 20px;
}

/* LOGO */
.logo {
  width: 100%;
  margin-bottom: 20px;
}

/* ALTIN YAZI */
.gold-text {
  text-align: center;
  font-size: 22px;
  font-weight: 700;
  background: linear-gradient(90deg, #d4af37, #ffd700, #b8962e);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* AÇIKLAMALAR */
.subtitle {
  text-align: center;
  font-size: 13px;
  color: #ccc;
  margin-bottom: 20px;
}

/* KARTLAR */
.card {
  background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
  border-radius: 15px;
  padding: 15px;
  margin: 10px 0;
  display: flex;
  align-items: center;
  gap: 15px;
  border: 1px solid rgba(212,175,55,0.3);
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.03);
  border-color: gold;
}

/* ICON */
.icon {
  font-size: 20px;
  color: gold;
}

/* LINK */
.card a {
  color: white;
  text-decoration: none;
  font-size: 15px;
}

/* FOOTER */
.footer {
  text-align: center;
  font-size: 12px;
  margin-top: 15px;
  color: #777;
}
.fa-instagram {
  background: linear-gradient(45deg, #feda75, #d62976, #962fbf);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-size: 22px;
}
</style>
</head>
